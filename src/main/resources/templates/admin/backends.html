<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>大模型配置 - LLM Proxy 管理</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/admin/app.css}" rel="stylesheet"/>
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" content="X-XSRF-TOKEN"/>
</head>
<body>
<div th:replace="~{admin/layout :: nav('backends')}"></div>
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">大模型配置</h4>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3 gap-2 flex-wrap">
        <div class="input-group input-group-sm" style="max-width: 320px;">
            <span class="input-group-text">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                </svg>
            </span>
            <input type="text" id="backend-search" class="form-control" placeholder="按名称模糊匹配" oninput="onBackendSearchInput(this.value)"/>
        </div>
        <button class="btn btn-primary btn-sm" onclick="addBackend()">+ 新增</button>
    </div>

    <table class="table table-bordered">
        <thead>
        <tr><th>名称</th><th>协议</th><th>base-url</th><th>默认模型</th><th>操作</th></tr>
        </thead>
        <tbody id="backend-tbody">
        </tbody>
    </table>

    <div class="d-flex justify-content-end align-items-center flex-wrap gap-3">
        <div id="backend-page-info" class="text-muted small"></div>
        <div class="input-group input-group-sm" style="width: auto;">
            <span class="input-group-text">每页</span>
            <select id="backend-page-size" class="form-select form-select-sm" style="width: 80px;" onchange="onBackendPageSizeChange(this.value)">
                <option value="5">5</option>
                <option value="10" selected>10</option>
                <option value="20">20</option>
                <option value="50">50</option>
            </select>
            <span class="input-group-text">条</span>
        </div>
        <ul class="pagination pagination-sm mb-0" id="backend-pagination"></ul>
    </div>
</div>

<!-- 删除确认 弹窗 -->
<div class="modal-overlay" id="backend-delete-modal">
    <div class="modal-dialog" style="max-width: 480px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">删除大模型</h5>
                <button type="button" class="modal-close" onclick="closeBackendDeleteModal()">×</button>
            </div>
            <div class="modal-body">
                <div id="backend-delete-tip" class="text-muted"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeBackendDeleteModal()">取消</button>
                <button type="button" class="btn btn-danger" id="backend-delete-confirm">删除</button>
            </div>
        </div>
    </div>
</div>

<!-- 新增/编辑 弹窗 -->
<div class="modal-overlay" id="backend-modal">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-title">新增大模型</h5>
                <button type="button" class="modal-close" onclick="closeBackendModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="backend-form">
                    <div class="row g-3">
                        <div class="col-md-4"><label class="form-label">名称</label><input id="name" class="form-control" required/></div>
                        <div class="col-md-4"><label class="form-label">协议</label>
                            <select id="protocol" class="form-select"></select>
                        </div>
                        <div class="col-md-4"><label class="form-label">默认模型</label><input id="defaultModel" class="form-control" required/></div>
                        <div class="col-md-12"><label class="form-label">base-url</label><input id="baseUrl" class="form-control" required/></div>
                        <div class="col-md-12">
                            <label class="form-label">api-key</label>
                            <div class="input-group">
                                <input id="apiKey" type="password" class="form-control" placeholder="请输入api-key"/>
                                <button type="button" class="btn btn-outline-secondary" onclick="toggleApiKeyVisible(this)" title="显示/隐藏">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                                        <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="advanced-toggle" onclick="toggleAdvanced(this)">
                        <span class="toggle-pill">
                            <span class="toggle-text">更多</span>
                            <svg class="toggle-arrow" width="12" height="12" viewBox="0 0 16 16" fill="currentColor">
                                <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/>
                            </svg>
                        </span>
                    </div>
                    <div class="advanced-section">
                        <div class="row g-3">
                            <div class="col-md-3"><label class="form-label">默认最大输出Token</label><input id="defaultMaxTokens" type="number" value="100000" class="form-control"/></div>
                            <div class="col-md-3"><label class="form-label">连接超时</label>
                                <div class="input-group">
                                    <input id="connectTimeout" type="number" min="1" step="1" class="form-control" value="10"/>
                                    <span class="input-group-text">秒</span>
                                </div>
                            </div>
                            <div class="col-md-3"><label class="form-label">读超时</label>
                                <div class="input-group">
                                    <input id="readTimeout" type="number" min="1" step="1" class="form-control" value="600"/>
                                    <span class="input-group-text">秒</span>
                                </div>
                            </div>
                            <div class="col-md-3"><label class="form-label">写超时</label>
                                <div class="input-group">
                                    <input id="writeTimeout" type="number" min="1" step="1" class="form-control" value="30"/>
                                    <span class="input-group-text">秒</span>
                                </div>
                            </div>
                            <div class="col-md-6"><label class="form-label">最大空闲连接数</label><input id="maxIdleConnections" type="number" class="form-control" value="20"/></div>
                            <div class="col-md-6"><label class="form-label">保活时长</label>
                                <div class="input-group">
                                    <input id="keepAliveDuration" type="number" min="1" step="1" class="form-control" value="300"/>
                                    <span class="input-group-text">秒</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeBackendModal()">取消</button>
                <button type="submit" form="backend-form" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/admin/app.js}"></script>
</body>
</html>
