<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>客户端配置 - LLM Proxy 管理</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/vendor/codemirror/codemirror.css}" rel="stylesheet"/>
    <link th:href="@{/vendor/codemirror/theme-nord.css}" rel="stylesheet"/>
    <link th:href="@{/admin/app.css}" rel="stylesheet"/>
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" content="X-XSRF-TOKEN"/>
</head>
<body>
<div th:replace="~{admin/layout :: nav('clients')}"></div>
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-3">
            <h6 class="text-muted">客户端列表</h6>
            <ul class="list-group" id="client-list"></ul>
        </div>
        <div class="col-9">
            <ul class="nav nav-tabs mb-2" id="file-tabs"></ul>
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center flex-grow-1 me-2" style="min-width:0">
                    <span id="file-path" class="text-muted small text-truncate"></span>
                    <span id="dirty-flag" class="text-muted small ms-3 flex-shrink-0"></span>
                </div>
                <div class="btn-group btn-group-sm flex-shrink-0">
                    <button id="update-btn" class="btn btn-outline-secondary">更新</button>
                    <button id="save-btn" class="btn btn-primary" disabled>保存</button>
                </div>
            </div>
            <textarea id="editor"></textarea>
        </div>
    </div>
</div>
<!-- 通用确认弹窗 (替代原生 confirm) -->
<div class="modal-overlay" id="confirm-modal">
    <div class="modal-dialog" style="max-width: 480px;">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">确认</h5>
                <button type="button" class="modal-close" onclick="confirmModalCancel()">×</button>
            </div>
            <div class="modal-body">
                <div id="confirm-modal-message" class="text-muted"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="confirmModalCancel()">取消</button>
                <button type="button" class="btn btn-primary" onclick="confirmModalOk()">确定</button>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/vendor/codemirror/codemirror.js}"></script>
<script th:src="@{/vendor/codemirror/addon-edit-matchbrackets.js}"></script>
<script th:src="@{/vendor/codemirror/addon-selection-active-line.js}"></script>
<script th:src="@{/vendor/codemirror/mode-toml.js}"></script>
<script th:src="@{/vendor/codemirror/mode-json.js}"></script>
<script th:src="@{/vendor/codemirror/mode-properties.js}"></script>
<script th:src="@{/admin/app-clients.js}"></script>
</body>
</html>
